<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brotherhood Sporting Club</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;800&display=swap">
<style id="css">
:root{--ink:#14303b;--lake:#3d7d78;--ember:#e0663a;--bg:#eef3f0;--card:#fff;--tx:#14303b;--mut:#5d7480;--ln:#d5e0dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a20;--card:#15303a;--tx:#e8f1ee;--mut:#98b0b8;--ln:#24424d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1a20;--card:#15303a;--tx:#e8f1ee;--mut:#98b0b8;--ln:#24424d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Anek Bangla','Noto Sans Bengali','Kalpurush',system-ui,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:10}
*{box-sizing:border-box}
.hd{background:var(--ink)}
.hd>div{max-width:640px;margin:auto;display:flex;align-items:center;gap:8px;padding:10px 12px}
.mb{background:none;border:0;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;padding:0}
.lg{width:46px;height:46px;border-radius:50%;background:#fff;margin-left:2px}
.sp{flex:1}
.ic{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;cursor:pointer}
.ic svg{width:20px;height:20px}
.wrap{max-width:640px;margin:auto;padding:14px}
.wrap>*{margin-bottom:18px}
.h2{font-size:20px;font-weight:800;margin:0 0 10px}
.bn{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:var(--ink)}
.bn>img,.bn>svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bt{position:absolute;inset:auto 0 0 0;padding:34px 16px 14px;background:linear-gradient(transparent,rgba(10,25,31,.85));color:#fff}
.bt b{display:block;font-size:clamp(20px,6vw,30px);font-weight:800;line-height:1.15}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bk{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:99px;background:var(--card);border:1.5px solid var(--ln);color:var(--tx);font-weight:600;font-size:15px;text-decoration:none}
.pt{font-size:30px;font-weight:800;line-height:1.2;margin:2px 0 14px}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ch b{display:block;font-size:19px;line-height:1.25}.ch small{color:var(--mut);font-size:13px}
.cb{width:46px;height:46px;border-radius:15px;background:var(--ember);color:#fff;display:grid;place-items:center;font-weight:800;font-size:23px}
.cbB{background:var(--lake)}.cbC{background:#c8962c}
.ms{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:4px 14px 16px;scroll-padding-inline:14px;scrollbar-width:none}
.ms::-webkit-scrollbar{display:none}
.mk{flex:0 0 152px;aspect-ratio:3/4;scroll-snap-align:start;position:relative;overflow:hidden;border:0;padding:0;border-radius:22px;background:var(--ink);color:#fff;font:inherit;text-align:left;cursor:pointer;box-shadow:0 8px 20px rgba(20,48,59,.22);transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.mk:active{transform:scale(.96)}
.mk img,.av{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av{display:grid;place-items:center;font-size:72px;font-weight:800;color:rgba(255,255,255,.88);background:linear-gradient(155deg,#3d7d78,#14303b)}
.nm{position:absolute;inset:auto 0 0 0;padding:38px 13px 13px;background:linear-gradient(transparent,rgba(8,20,26,.92))}
.nm span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:700;font-size:16px;line-height:1.3}
.mx{position:fixed;inset:0;background:rgba(6,16,20,.62);z-index:55;display:grid;place-items:center;padding:20px;animation:fd .2s}
.mp{background:var(--card);border-radius:26px;width:100%;max-width:340px;max-height:92%;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.3,1.4,.5,1)}
.ph{position:relative;padding:36px 0 20px;background:linear-gradient(170deg,#1f4f5e,#14303b);display:grid;place-items:center;border-radius:26px 26px 0 0}
.ph .lgo{position:absolute;top:12px;left:12px;width:46px;height:46px;border-radius:50%;background:#fff}
.pc{position:relative;width:156px;height:156px;border-radius:50%;overflow:hidden;border:4px solid var(--ember);box-shadow:0 0 0 7px rgba(255,255,255,.12)}
.pc img,.pc .av{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .av{font-size:66px}
.ac{display:flex;gap:10px;padding:0 20px 20px}
.hn{margin:0;padding:10px 20px 0;color:var(--mut);font-size:13px;text-align:center}
.hn+.ac{padding-top:12px}
.cv{display:block;width:100%;border-radius:26px 26px 0 0}
.x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(10,25,31,.62);color:#fff;font-size:17px;cursor:pointer;z-index:2}
.pn{padding:16px 20px 12px;text-align:center}.pn h3{margin:0;font-size:23px;line-height:1.25;font-weight:800}
.pill{display:inline-block;margin-top:8px;padding:3px 13px;border-radius:99px;background:var(--ember);color:#fff;font-size:13px;font-weight:600}
.ip{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 20px 18px}
.it{background:var(--bg);border-radius:14px;padding:10px 13px}
.it:last-child:nth-child(odd){grid-column:1/-1}
.it small{display:block;color:var(--mut);font-size:12px}.it b{font-size:16px;line-height:1.3}
@keyframes fd{from{opacity:0}to{opacity:1}}
.tl{aspect-ratio:1;border-radius:16px;background:var(--card);border:1.5px solid var(--ln);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--tx);font-weight:600;font-size:14px;text-align:center;padding:6px;cursor:pointer}

.tl span{font-size:30px;line-height:1;display:inline-block;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tl{transition:transform .2s cubic-bezier(.3,1.5,.5,1),box-shadow .2s;animation:pop .5s cubic-bezier(.3,1.5,.5,1) backwards}
.tl:nth-child(2){animation-delay:.07s}.tl:nth-child(3){animation-delay:.14s}.tl:nth-child(4){animation-delay:.21s}.tl:nth-child(5){animation-delay:.28s}.tl:nth-child(6){animation-delay:.35s}
@media(hover:hover){.tl:hover{transform:translateY(-4px);box-shadow:0 10px 20px rgba(20,48,59,.18)}.tl:hover span{transform:scale(1.18) rotate(-6deg)}}
.tl:active{transform:scale(.94)}.tl:active span{transform:scale(1.25)}
.sb{transition:transform .2s cubic-bezier(.3,1.5,.5,1);animation:ring 2.4s ease-out infinite}
.sb:active{transform:scale(.96)}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(14px)}to{opacity:1;transform:none}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(224,102,58,.55)}70%,100%{box-shadow:0 0 0 16px rgba(224,102,58,0)}}
.sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px;scrollbar-width:none}
.sl::-webkit-scrollbar{display:none}
.sl>*{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;object-fit:cover;width:100%}
.pl{display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
.dt{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dt i{width:7px;height:7px;border-radius:4px;background:var(--ln)}
.dt i.on{background:var(--ember);width:18px}
.sb{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;background:var(--ember);color:#fff;text-decoration:none;cursor:pointer}
.sb b{display:block;font-size:19px}.sb small{font-size:15px;opacity:.95}
.ct{background:var(--card);border:1.5px solid var(--ln);border-radius:16px;padding:18px;text-align:center}
.ct .row{display:flex;justify-content:center;gap:16px;margin-top:12px}
.ci{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;cursor:pointer}
.ci svg{width:25px;height:25px}
.ft{background:var(--ink);color:#c9dad6;text-align:center;padding:16px 14px;font-size:14px}
.sc{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.mn{position:fixed;left:0;top:0;bottom:0;width:270px;background:var(--card);z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
.mn.on{transform:none}
.mi{display:block;width:100%;padding:15px 20px;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--tx);font:inherit;font-size:17px;text-align:left;cursor:pointer}
.ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:90;max-width:88%;font-size:15px;text-align:center}
.ad{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
details{background:var(--card);border:1.5px solid var(--ln);border-radius:12px;margin-bottom:10px}
summary{padding:14px;font-weight:700;cursor:pointer}
.fb{padding:0 14px 14px}
.fb label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.ad input:not([type=file]){width:100%;padding:10px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.pb{padding:10px 16px;border-radius:10px;border:0;background:var(--ink);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.pb.o{background:var(--ember)}.pb.g{background:var(--ln);color:var(--tx)}
.tr{display:grid;grid-template-columns:56px 1fr auto;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--ln)}
.ad select{width:100%;padding:10px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.mr{border:1.5px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sv{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.mn,.tl,.tl span,.sb,.mk{transition:none}.tl,.sb,.mx,.mp{animation:none}}

.mp input{width:100%;padding:10px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.fl{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
.stt{max-width:640px;margin:0 auto;padding:0 14px 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sx{background:var(--card);border:1.5px solid var(--ln);border-radius:16px;padding:14px 6px;text-align:center}
.sx span{font-size:22px;display:block}
.sx b{display:block;font-size:30px;font-weight:800;line-height:1.25;color:var(--ember);font-variant-numeric:tabular-nums}
.sx small{color:var(--mut);font-size:14px}
.h3{font-size:17px;font-weight:800;margin:0 0 10px}
.em{text-align:center;color:var(--mut);padding:30px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 16px;border-radius:99px;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ember);border-color:var(--ember);color:#fff}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc2,.jb{border:0;padding:0;background:var(--ln);border-radius:12px;overflow:hidden;cursor:pointer;display:block;width:100%;aspect-ratio:1}
.pc2 img,.jb img{width:100%;height:100%;object-fit:cover;display:block}
.jg{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.jf{margin:0}.jb{aspect-ratio:4/5;border-radius:16px}
.jf figcaption{text-align:center;font-weight:600;margin-top:8px;line-height:1.35}
.ev{display:flex;gap:14px;background:var(--card);border:1.5px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:12px}
.ev.ps{opacity:.8}
.dd{flex:0 0 68px;border-radius:14px;background:var(--ink);color:#fff;text-align:center;padding:8px 4px;align-self:flex-start;line-height:1.15}
.dd b{display:block;font-size:26px}.dd span{display:block;font-size:13px}.dd small{font-size:12px;opacity:.8}
.eb{min-width:0;flex:1}.eb h3{margin:6px 0 4px;font-size:18px;line-height:1.3}
.ev .ds{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 10px;color:var(--mut)}
.jn{display:inline-block;padding:9px 20px;border-radius:12px;background:var(--ember);color:#fff;font-weight:700;text-decoration:none}
.ach{background:var(--card);border:1.5px solid var(--ln);border-radius:18px;overflow:hidden;margin-bottom:14px;cursor:pointer}
.ach>img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.ab2{padding:14px 16px 16px}.ab2 h3{margin:8px 0 4px;font-size:19px;line-height:1.3}
.ach .ds{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0;color:var(--mut);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ach.open .ds{display:block}.ach.open .mr2{display:none}
.mr2{color:var(--ember);font-weight:600}
.abt{background:var(--card);border:1.5px solid var(--ln);border-radius:18px;padding:22px;text-align:center}
.abt .al{width:96px;height:96px;border-radius:50%}
.abt p{text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}
.lb{align-content:center;justify-items:center}.lb img{max-width:100%;max-height:78vh;border-radius:14px;display:block}.lb p{color:#fff;margin:10px 0 0;text-align:center}
.ad textarea{width:100%;padding:10px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;resize:vertical}
.g3{display:grid;grid-template-columns:1fr 1.7fr 1.1fr;gap:8px}
@media(min-width:820px){
.pg{grid-template-columns:repeat(6,1fr)}.jg{grid-template-columns:repeat(4,1fr)}.ach>img{aspect-ratio:21/9}
.stt{max-width:1120px;padding:0 24px 22px}
.hd>div,.wrap{max-width:1120px}
.hd>div{padding:12px 24px}
.wrap{padding:22px 24px}
.bn{aspect-ratio:21/8}
.bt{padding:50px 28px 22px}.bt b{font-size:38px}.bt span{font-size:18px}
.gr{grid-template-columns:repeat(6,1fr);gap:16px}
.tl{font-size:17px}.tl span{font-size:38px}
.sl>*{aspect-ratio:16/7}
.mk{flex-basis:200px}
.ms{margin:0 -24px;padding:4px 24px 16px;scroll-padding-inline:24px}
}
</style></head>
